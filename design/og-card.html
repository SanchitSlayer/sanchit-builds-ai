svg { position: absolute; right: 30px; top: 70px; width: 470px; height: 470px; }

.url { position: absolute; right: 80px; bottom: 30px; font-family: GeistMono, monospace; font-size: 15px; color: #828b97; }
.icon { width: 180px; height: 180px; background: #0b0d10; display: grid; place-items: center; font: 600 64px GeistMono, monospace; color: #e8eaed; }
.icon-only .card { display: none; }
.icon i { color: #2dd4bf; font-style: normal; }
